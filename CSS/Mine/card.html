<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     .container{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;          /* spacing between cards */
    height: 100vh;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
}

.card{
    width: 300px;
    padding: 20px;
    margin: 0;          /* gap handles spacing */
    border: 1px solid #ccc;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

        h2 {
            color: #389;
        }

        p {
            color: #666;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

       
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            
            <h2>Card Title</h2>
            <p>This is the card content.</p>
            <button>Button</button>
        </div>
         <div class="card">
            <h2>Card Title</h2>
            <p>This is the card content.</p>
            <button>Button</button>
        </div>
    </div>
</body>
</html>
