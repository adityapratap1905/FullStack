<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: #0f172a;
            color: white;

        }
        nav{
            width: 100%;
            padding: 1rem 5%;
            background:rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            margin-bottom: 2rem;

            display:flex;
            justify-content: flex-end;
            align-items: center;
        }

        .logo{
            font-size: 1.8rem;
            font-weight:700;
            color:#d31a89;
            text-transform: uppercase;
            letter-spacing: 1px;

            margin-right: auto;
        }

        .menu{
            list-style: none;
            display: flex;
            gap: 2rem;

            margin-right:30px;
        }

        .menu li a{
            position: relative;
            font-size: 1.0rem;
            font-weight:500;
            text-decoration:none;
            color: #e2e8f0;
            cursor: pointer;
            transition:0.3s ease-in-out;
        
        }

        .menu li a:hover{
            color:#38bdf8;
            text-shadow: 0 0 10px #38bdf8;
        }

        .btns{
            display: flex;
            gap: 1rem;
        }

        .btn{
            padding: 0.5rem 1.5rem; 
            border-radius: 30px;
            font-weight:600;
            font-size:1rem;  
            background:#38bdf8;
            color:#0f172a;
            box-shadow: 0 0 15px #38bdf8;
            transition:0.3s ease-in-out;
            border:none;
            cursor: pointer;
        }

        .btn:hover{
            background:#0aa9f3;
            box-shadow: 0 0 25px #0aa9f3;
            color:#fff;
        }


    </style>
</head>
<body>
    <nav>
        <div class="logo">Love❤️</div>
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            </ul>  
            <div class="btns">
                <button class="btn">Login</button>
                <button class="btn">Register</button>
            </div>
            </nav>
       
    
</body>
</html>
