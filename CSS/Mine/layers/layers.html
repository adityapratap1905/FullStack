<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layers</title>
    <style>
        @layer base{
            p{
                background-color: red;
                color: white;
            }
        }

        @layer spi{
            p{
                background-color: black;
                color: white;
            }
        }

        @layer spio{
            p{
                background-color: orange;
                color: white;
            }
        }
        </style>
</head>
<body>
    <p id="para">Hello world!</p>
    <div>
    <p id="para">Hello world!</p>
    <p id="para">Hello world!</p>
    <p id="para">Hello world!</p>
    </div>
    <p id="para">Hello world!</p>
</body>
</html>
