<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
            height: 200px;
            width: 200px;
            background-image: linear-gradient(to right, red, yellow);
            border-radius: 20px;
        } 
        .box2{
            height: 200px;
            width: 200px;
            background-image: linear-gradient(to bottom, blue, green);
            border-radius: 20px;
            margin-left: 50px;
        }
        .box3{
            height: 200px;
            width: 200px;
            background-image: linear-gradient(to top right, purple, pink);
            border-radius: 20px;
            margin-left: 50px;
        }
        .box4{
            height: 200px;
            width: 200px;
            background-image: linear-gradient(to bottom left, orange, cyan);
            border-radius: 20px;
            margin-left: 50px;
        }
        .box5{
            height: 200px;
            width: 200px;
            background-image: linear-gradient(45deg, black, white);
            border-radius: 20px;
            margin-left: 50px;
        }
        .box6{
            height: 200px;
            width: 200px;
            /* background-image: linear-gradient( #ff0000 0% 20%, #00ff00 20% 40%, #0000ff 40% 60%, #ffff00 60% 80%, #ff00ff 80% 100%  ); */
            background-image: linear-gradient( #ff0000 0% 20%, #00ff00 40% 60%, #0000ff 80% 100%);
            border-radius: 20px;
            margin-left: 50px;
        }
        p{
            text-align: center;
            font-size: 20px;
            color: white;
            margin-top: 80px;
        } 
        </style>
</head>
<body>
    <div class="container">
        <div class="box1"><p>Linear Gradient Box1</p></div>
        <div class="box2"><p>Linear Gradient Box2</p></div>
        <div class="box3"><p>Linear Gradient Box3</p></div>
        <div class="box4"><p>Linear Gradient Box4</p></div>
    <div class="box5"><p>Linear Gradient Box5</p></div>
    <div class="box6"><p>Linear Gradient Box6</p></div>
    <div class="box7"><p>Linear Gradient Box7</p></div>
    <div class="box8"><p>Linear Gradient Box8</p></div>
    </div>
</body>
</html>
