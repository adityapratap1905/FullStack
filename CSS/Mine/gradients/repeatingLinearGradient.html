<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
            height: 200px;
            width: 200px;
            background-image: repeating-linear-gradient( orange 0px 20px, white 20px 40px, green 40px 60px);
            border-radius: 20px;
        } 
        .box2{
            height: 200px;
            width: 200px;
            background-image: repeating-linear-gradient( to right, red 0px 20px, yellow 20px 40px, blue 40px 60px);
            border-radius: 20px;
            margin-left: 50px;
        }
        .box3{
            height: 200px;
            width: 200px;
           background: repeating-linear-gradient(-45deg,#ff6a00 0px 20px, #ffdd00 20px 40px, #00c9ff 40px 60px);
            margin-left: 50px;
        }
        .box4{
            height: 200px;
            width: 200px;
           background: repeating-linear-gradient(-45deg,#ff6a00 0px 20px, #ffdd00 20px 40px, #00c9ff 40px 60px,#00c9ff);
            margin-left: 50px;
        }
        .box5{
            height: 200px;
            width: 200px;
           background: repeating-linear-gradient(red,rgba(255,0,0,0));
           margin-left: 50px;
           border:solid 2px black;
        }
        p{
            text-align: center;
            font-size: 20px;
            color: rgb(0, 0, 0);
        } 
        </style>
</head>
<body>
    <div class="container">
        <div class="box1"><p>Repeating linear gradient Box1</p></div>
        <div class="box2"><p>Repeating linear gradient Box2</p></div>
        <div class="box3"><p>Repeating linear gradient Box3</p></div>
        <div class="box4"><p>Repeating linear gradient Box4</p></div>
    <div class="box5"><p>Repeating linear gradient Box5</p></div>

    </div>
</body>
</html>
