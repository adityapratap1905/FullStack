<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Card</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f2f2f2;

    font-family:Arial, Helvetica, sans-serif;

}

.card{
    position:relative;
    width:300px;

    background:white;

    padding:25px;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

    text-align:center;

}

.card h2{

    margin-bottom:15px;

}

.card p{

    margin-bottom:20px;

    color:#555;

}

button{

    padding:10px 20px;

    border:none;

    border-radius:8px;

    background:#4CAF50;

    color:white;

    cursor:pointer;

}

button:hover{

    background:#388E3C;

}
    </style>
</head>

<body>

<div class="card">

    <h2>Card Title</h2>

    <p>
        This is a simple card created using HTML and CSS.
    </p>

    <button>Read More</button>

</div>

</body>
</html>
