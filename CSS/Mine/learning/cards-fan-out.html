<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Fan out</title>
    <style>
        *{
           box-sizing: border-box;
        }
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:rgb(155, 63, 109);
        }
        .stack{
            position:relative;
            width: 180px;
            height:240px;
        }

        .card{
            position:absolute;
            top:0;
            left:0;
            width: 180px;
            height:240px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition:transform 0.5s cubic-bezier(.2,.9,.3,1.2);
            font-weight: 900;
            font-size:30px;
            font-family: cursive;
            display:flex;
            justify-content: center;
            align-items: center;
        }

        .c1{
            background:linear-gradient(135deg, #ff6a00, #ff2d95);
            transform:rotate(-6deg );
            z-index: 1;

        }

        .c2{
            background:linear-gradient(135deg, #00c9ff, #92fe9d);
            transform:rotate(0deg );
            z-index: 2;
        }

        .c3{
            background:linear-gradient(135deg, #6a00ff,#00c9ff);
            transform:rotate(6deg );
            z-index: 3;
        }

        .stack:hover .c1{
            transform:translate(-90px, -30px) rotate(-18deg);
        }

        .stack:hover .c2{
            transform:translate(0px, -55px) rotate(0deg);
        }

        .stack:hover .c3{
            transform:translate(90px, -30px) rotate(18deg);
        }

    </style>
</head>
<body>
    <div class="stack">
        <div class="card c1">Design</div>
        <div class="card c2">Build</div>
        <div class="card c3">Ship</div>
    </div>
</body>
</html>
