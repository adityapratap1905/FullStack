<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
    height: 200px;
    width: 200px;
    background-color: white;
    border-radius: 50%;
    margin: 50px;
}

.ripple-effect {
    height: 100%;
    width: 100%;
    border-radius: 50px;
    overflow: hidden;
     background: radial-gradient(
        ellipse at 50% 50%,
        rgba(255, 0, 0, 0.5) 0%,
        rgba(255, 0, 0, 0) 100%
    );
    border-radius: 50%;
    animation: ripple 1s infinite;
}

@keyframes ripple {
    0% {
        transform: scale(0);
    }
    100% {
        transform: scale(2);
    }
}   
        </style>
</head>
<body>
    <div class="box">
        <div class="ripple-effect">
        </div>
    </div>
</body>
</html>
