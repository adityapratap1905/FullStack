<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
    <style>
    div{
        width:200px;
        height:200px;
        outline: 1px solid black;
        box-shadow: 10px 10px 5px black;
    }
    p{
        font-size: 100px;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        font-weight: bold;
        text-align: center;
        text-shadow:5px 5px 5px rgb(185, 13, 13),15px 15px 5px rgb(23, 82, 23);
        font-style:oblique;
        text-decoration:underline;
        text-transform:capitalize ;
        word-spacing: 20px;
        letter-spacing: 5px;
        text-decoration-color: rgb(57, 57, 99);
        opacity: 80%;
        /* line-height: 5; */
        transform: rotate(45deg);
        direction:rtl;
        vertical-align:top;
        white-space: nowrap;
        text-emphasis-style: filled;
        /* background: yellow; */
        }
    img{
        width:50%;
        filter: drop-shadow(3px 0 0px blue);
    }
    </style>
</head>
<body>
    <div></div>
    <p>Aditya Chauhan</p>
    <img src="pngwing.com (1).png" alt="img">
</body>
</html>
