
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: cursive;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f2f2f2;
        }

        .box1 {
            background-color: rgb(226, 226, 105);

            width: 400px;
            min-height: 400px;

            border-radius: 10px;

            box-shadow: 10px 10px 5px black;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        form {
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #999;
            border-radius: 5px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border: 2px solid #333;
        }

        button {
            display: block;
            width: 100%;

            padding: 12px;

            background-color: black;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box1">

            <form action="">

                <h1>Login Form</h1>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

</body>

</html>
