<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav-bar</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family:cursive;
        }
        nav{
            background-color:rgb(226, 226, 105);
            height:100px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .container{
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .box{
            height:50px;
            width:500px;
            border:2px solid black;
            border-radius:10px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        ul{
            list-style-type:none;
            display:flex;
            justify-content:space-evenly;
            align-items:center;
            width:100%;
        }
        li{
            cursor:pointer;
        }
        
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="box">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
        </div>
        </div>
    </nav>
</body>
</html>
