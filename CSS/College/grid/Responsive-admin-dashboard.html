<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        /* Main container */

        .container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
        }

        /* Common box */

        .container > div {
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
            font-size: 25px;
            font-weight: bold;
        }

        /* Box 1 */

        .box1 {
            width: 100%;
            height: 100px;
            background-color: lightcoral;
        }

        /* Box 2 - 5 */

        .box2,
        .box3,
        .box4,
        .box5 {
            width: calc(25% - 12px);
            height: 150px;
            background-color: lightblue;
        }

        /* Box 6 - 8 */

        .box6,
        .box7,
        .box8 {
            width: calc(33.33% - 10px);
            height: 150px;
            background-color: lightgreen;
        }


        /* ------------------------ */
        /* Tablet */
        /* ------------------------ */

        @media (max-width: 900px) {

            .box1 {
                width: 100%;
            }

            .box2,
            .box3,
            .box4,
            .box5 {
                width: calc(50% - 8px);
            }

            .box6,
            .box7,
            .box8 {
                width: calc(33.33% - 10px);
            }
        }


        /* ------------------------ */
        /* Mobile */
        /* ------------------------ */

        @media (max-width: 500px) {

            h1 {
                font-size: 25px;
            }

            .container {
                flex-direction: column;
            }

            .container > div {
                width: 100%;
                height: 120px;
            }
        }

    </style>

</head>

<body>

    <h1>Admin Dashboard</h1>

    <div class="container">

        <div class="box1">1</div>

        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>

        <div class="box6">6</div>
        <div class="box7">7</div>
        <div class="box8">8</div>

    </div>

</body>

</html>
