<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container{

            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
            grid-template-rows: repeat(3,1fr);
            gap: 3%;
        }

        .container>div{
            
            outline: 2px solid black;
            
            
        }
        

    
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
