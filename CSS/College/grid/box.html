<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 180px 1fr;

            grid-template-rows: 80px 1fr 60px;

            gap: 10px;

            height: 600px;
        }

        .header {
            grid-column: 1 / 3;

            background: #d9d9ff;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar {
            grid-row: 2 / 3;

            background: #c9f0f0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            display: grid;

            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 120px;

            gap: 10px;
        }

        .main-content {
            grid-column: 1 / 3;

            background: #eee5f5;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #e5d9f5;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer {
            grid-column: 1 / 3;

            background: #d9d9ff;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header class="header">
            HEADER
        </header>

        <aside class="sidebar">
            SIDEBAR
        </aside>

        <main class="main">

            <div class="main-content">
                MAIN CONTENT
            </div>

            <div class="card">
                CARD 1
            </div>

            <div class="card">
                CARD 2
            </div>

        </main>

        <footer class="footer">
            FOOTER
        </footer>

    </div>

</body>
</html>
