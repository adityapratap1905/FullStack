<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Product Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Our Products</h1>

<div class="product-container">

    <!-- Product 1 -->
    <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Shoes" alt="Shoes">

        <h2>Running Shoes</h2>

        <p>Comfortable lightweight running shoes.</p>

        <h3>₹2,499</h3>

        <button>Add to Cart</button>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Watch" alt="Watch">

        <h2>Smart Watch</h2>

        <p>Fitness tracker with heart rate monitor.</p>

        <h3>₹3,999</h3>

        <button>Add to Cart</button>
    </div>

    <!-- Product 3 -->
    <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Headphones" alt="Headphones">

        <h2>Headphones</h2>

        <p>Wireless headphones with premium sound.</p>

        <h3>₹1,999</h3>

        <button>Add to Cart</button>
    </div>

    <!-- Product 4 -->
    <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Laptop" alt="Laptop">

        <h2>Laptop</h2>

        <p>15.6-inch Full HD display with SSD storage.</p>

        <h3>₹59,999</h3>

        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
