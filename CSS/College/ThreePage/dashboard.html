<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            gap: 20px; /* Space between cards */
            flex-wrap: wrap; /* Allow cards to wrap on smaller screens */
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 200px;
            text-align: center;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .h1 {
            align-items: center;            
            display: flex;
            justify-content: center;

            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Dashboard</h1>
    <div class="container">
        <!-- Card 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Card Image 1">
            <h3>Card Title 1</h3>
            <p>This is a short description for card 1.</p>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Card Image 2">
            <h3>Card Title 2</h3>
            <p>This is a short description for card 2.</p>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Card Image 3">
            <h3>Card Title 3</h3>
            <p>This is a short description for card 3.</p>
        </div>  
    </div>
</body>
</html>
