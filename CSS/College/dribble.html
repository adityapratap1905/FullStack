<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
        }
        .container{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
            height: 300px;
            width: 400px;
            background-color:black;
            border-radius: 10px;
            /* display: flex; */
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle, orange,black,transparent);
        }
        h1{
            font-size: 24px;
            color: #bf1616;
        }
        p{
            font-size: 16px;
            color: #321785;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <h1>Dribble</h1>
            <p>This is a simple dribble page.</p>
        </div>
    </div>
</body>
</html>
