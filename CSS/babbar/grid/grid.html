<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        body{
            height:100vh;
            width:100vw;
        }

        .container{
            background-color:rgb(127, 148, 255);
            height:100%;
            width:100%;
            padding:10px;
            display:grid;
            column-gap: 10px;
            row-gap: 10px;
            grid-template-columns: repeat(3,1fr);
           
            

        }

        .container>div{
            background-color: rgb(92, 48, 107);
            border:2px solid black;
            text-align: center;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">Item1</div>
        <div class="items">Item2</div>
        <div class="items">Item3</div>
        <div class="items">Item4</div>
        <div class="items">vItem5</div>
        <div class="items">Item6</div>
    </div>
</body>
</html>
